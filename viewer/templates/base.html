<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Media Viewer{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body
  data-page-size="{{ page_size or 20 }}"
  data-current-type="{{ current_type or '' }}"
  data-current-query="{{ query or '' }}"
  data-current-sort="{{ current_sort or 'newest' }}"
>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
